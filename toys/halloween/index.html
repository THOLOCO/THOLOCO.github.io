<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Halloween</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            background-color: #ffe6f0;
            font-family: 'Comic Neue', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            overscroll-behavior: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .overlay-body {
            background-color: #fff7fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .overlay-title {
            font-size: 24px;
            color: #ff6f91;
            margin-bottom: 16px;
        }

        .overlay-button {
            background-color: #ffb3c1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .overlay-button:hover {
            background-color: #ff8c9f;
        }

        /* 铺满视口，而不是调起播放器 */
        .scare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: none;
            background: #000;
            pointer-events: none;
            cursor: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            background: #000;
        }

        /* 隐藏 WebKit 原生控件的兜底 */
        video::-webkit-media-controls,
        video::-webkit-media-controls-enclosure,
        video::-webkit-media-controls-panel,
        video::-webkit-media-controls-play-button,
        video::-webkit-media-controls-start-playback-button {
            display: none !important;
            -webkit-appearance: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>

<body>

    <!-- Overlay de cookies kawaii -->
    <div id="overlay" class="overlay">
        <div class="overlay-body">
            <p class="overlay-title">¿Quieres celebrar Halloween conmigo?</p>
            <button id="accept-button" class="overlay-button">🎃 Si</button>
            <button id="decline-button" class="overlay-button">🕸 No</button>
        </div>
    </div>

    <div id="scare" class="scare">
        <video id="video"
            src="video.mp4"
            loop preload="auto"
            playsinline webkit-playsinline
            disablepictureinpicture disableremoteplayback
            controlslist="nodownload nofullscreen noremoteplayback noplaybackrate"></video>
    </div>

    <script>
        const video = document.getElementById("video");
        const overlay = document.getElementById("overlay");
        const scare = document.getElementById("scare");
        const acceptButton = document.getElementById("accept-button");
        const declineButton = document.getElementById("decline-button");

        let started = false;

        // ---- 全屏：只对页面容器调 API，绝不碰 video 的原生全屏 ----
        // （video.webkitEnterFullscreen 会调起系统播放器界面，所以坚决不用）
        function goFullscreen() {
            const el = document.documentElement;
            const fn = el.requestFullscreen || el.webkitRequestFullscreen ||
                       el.mozRequestFullScreen || el.msRequestFullscreen;
            if (fn) { try { fn.call(el); } catch (e) {} }
            // iOS Safari 不支持元素全屏 —— 那就什么都不做，
            // 靠上面的 CSS(100vw/100vh) 自然铺满，跟原页面效果一致。
        }

        function startVideo() {
            started = true;
            overlay.style.display = 'none';  // Oculta el overlay
            scare.style.display = 'block';   // Muestra el video
            goFullscreen();                  // 尝试进入全屏（不涉及播放器）
            video.play().catch(function () {}); // Reproduce el video
        }

        acceptButton.addEventListener("click", startVideo);
        declineButton.addEventListener("click", startVideo);

        // ---- 万一退出了全屏，拉回来 ----
        function lockFullscreen() {
            if (!started) return;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                goFullscreen();
                if (video.paused) { video.play().catch(function () {}); }
            }
        }
        document.addEventListener("fullscreenchange", lockFullscreen);
        document.addEventListener("webkitfullscreenchange", lockFullscreen);

        // ---- 屏蔽一切交互 ----
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        document.addEventListener("selectstart", function (e) { e.preventDefault(); });
        document.addEventListener("dragstart", function (e) { e.preventDefault(); });
        window.addEventListener("keydown", function (e) {
            const k = e.key;
            if (k === "Escape" || k === " " || k === "Spacebar" ||
                k === "Tab" || k === "Enter" || k.indexOf("Arrow") === 0) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
        document.addEventListener("touchmove", function (e) {
            if (e.touches && e.touches.length > 1) { e.preventDefault(); }
        }, { passive: false });
    </script>

</body>

</html>
